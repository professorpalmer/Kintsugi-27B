<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voxel Pagoda</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 220);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------- Lighting ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff2cc, 1.3);
sun.position.set(40, 60, 25);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.3);
fill.position.set(-30, 20, -30);
scene.add(fill);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(140, 1, 140),
  new THREE.MeshLambertMaterial({ color: 0x5a9b4a })
);
ground.position.y = -0.5;
scene.add(ground);

// ---------- Voxel helper ----------
const box = new THREE.BoxGeometry(1, 1, 1);
const matCache = {};
function mat(c) {
  if (!matCache[c]) matCache[c] = new THREE.MeshLambertMaterial({ color: c });
  return matCache[c];
}
function cube(x, y, z, c) {
  const m = new THREE.Mesh(box, mat(c));
  m.position.set(x, y, z);
  scene.add(m);
}
function slab(x0, x1, y, z0, z1, c) { // inclusive integer range, single cube layer
  for (let x = x0; x <= x1; x++)
    for (let z = z0; z <= z1; z++)
      cube(x, y, z, c);
}
function solidBox(cx, cz, w, d, y0, y1, c) { // centered, inclusive
  const h = (w - 1) / 2, hd = (d - 1) / 2;
  for (let x = cx - h; x <= cx + h; x++)
    for (let z = cz - hd; z <= cz + hd; z++)
      for (let y = y0; y <= y1; y++)
        cube(x, y, z, c);
}

// ---------- Colors ----------
const RED   = 0xb03a2e;
const WALL  = 0xd9b58a;
const ROOF  = 0x45455a;
const ROOF2 = 0x3a3a4c;
const GOLD  = 0xd4af37;
const STONE = 0x9a9aa0;
const STONE2= 0x808088;

// ---------- Base ----------
slab(-4, 4, 1, -4, 4, STONE);
slab(-3, 3, 2, -3, 3, STONE2);
// steps leading to the front
slab(-2, 2, 1, 5, 7, STONE);

// ---------- Five tiers ----------
const widths = [7, 5, 5, 3, 3];
let y = 3; // first tier base
for (let t = 0; t < 5; t++) {
  const w = widths[t];
  const h = (w - 1) / 2;
  const bodyColor = (t % 2 === 0) ? RED : WALL;

  // body: w x w x 3
  solidBox(0, 0, w, w, y, y + 2, bodyColor);

  // roof: flared eave (w+2 wide), then w, then w-2
  const eave = w + 2, e = (eave - 1) / 2;
  solidBox(0, 0, eave, eave, y + 3, y + 3, ROOF);
  solidBox(0, 0, w, w, y + 4, y + 4, ROOF2);
  solidBox(0, 0, Math.max(w - 2, 1), Math.max(w - 2, 1), y + 5, y + 5, ROOF);

  // gold corner posts on the eave corners
  for (const sx of [-1, 1])
    for (const sz of [-1, 1])
      cube(sx * e, y + 4, sz * e, GOLD);

  y += 6;
}

// ---------- Spire ----------
let sy = y;
cube(0, sy, 0, GOLD);
cube(0, sy + 1, 0, GOLD);
slab(-1, 1, sy + 2, -1, 1, GOLD);   // cross bar
cube(0, sy + 3, 0, GOLD);
cube(0, sy + 4, 0, GOLD);
cube(0, sy + 5, 0, 0xe8c840);       // tip

// ---------- Orbiting camera ----------
let angle = 0;
function animate() {
  requestAnimationFrame(animate);
  angle += 0.003;
  const R = 48;
  camera.position.set(Math.cos(angle) * R, 32, Math.sin(angle) * R);
  camera.lookAt(0, 18, 0);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
